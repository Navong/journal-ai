<!DOCTYPE html>
<html>
<head>
  <title>Clear Audio Cache</title>
</head>
<body>
  <h1>Clear Audio Cache</h1>
  <button onclick="clearCache()">Clear IndexedDB Audio Cache</button>
  <div id="result"></div>

  <script>
    async function clearCache() {
      try {
        // Delete the audio cache database
        await new Promise((resolve, reject) => {
          const request = indexedDB.deleteDatabase('serenity-audio-cache');
          request.onsuccess = resolve;
          request.onerror = reject;
        });

        document.getElementById('result').innerHTML = '<p style="color: green;">✅ Audio cache cleared! Refresh the app to test fresh streaming.</p>';
      } catch (error) {
        document.getElementById('result').innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
